  <!-- ============ CODE EDITOR PANE (left, y=380..720) ============ -->
  <g transform="translate(48, 380)" xml:space="preserve">
    <!-- Window frame -->
    <rect width="588" height="340" rx="8" fill="#26221E"/>
    <!-- Title bar -->
    <rect width="588" height="32" rx="8" fill="#363029"/>
    <rect y="24" width="588" height="8" fill="#363029"/>
    <circle cx="20" cy="16" r="5" fill="#E06C75"/>
    <circle cx="38" cy="16" r="5" fill="#E5C07B"/>
    <circle cx="56" cy="16" r="5" fill="#98C379"/>
    <text x="294" y="20" text-anchor="middle" font-size="12" fill="#A89986">main.ts — Umber</text>

    <!-- Code body -->
    <g class="mono" font-size="13">
      <!-- line numbers and code, vertical pitch ~22px -->
      <!-- L1: comment -->
      <text x="20" y="62" fill="#A89986">1</text>
      <text x="50" y="62" fill="#A8BDD6">// fetch user from cache, falling back to network</text>
      <!-- L2: async function getUser(id: number): Promise&lt;User&gt; { -->
      <text x="20" y="84" fill="#A89986">2</text>
      <text x="50" y="84">
        <tspan fill="#C586B0">async function </tspan><tspan fill="#88A6C5">getUser</tspan><tspan fill="#A89986">(</tspan><tspan fill="#D4BC91">id</tspan><tspan fill="#A89986">: </tspan><tspan fill="#E5C07B">number</tspan><tspan fill="#A89986">): </tspan><tspan fill="#E5C07B">Promise</tspan><tspan fill="#A89986">&lt;</tspan><tspan fill="#E5C07B">User</tspan><tspan fill="#A89986">&gt; {</tspan>
      </text>
      <!-- L3: const cached = cache.get(id) -->
      <text x="20" y="106" fill="#A89986">3</text>
      <text x="50" y="106">
        <tspan fill="#A89986">  </tspan><tspan fill="#C586B0">const</tspan><tspan fill="#D4BC91"> cached </tspan><tspan fill="#A89986">= </tspan><tspan fill="#D4BC91">cache</tspan><tspan fill="#A89986">.</tspan><tspan fill="#88A6C5">get</tspan><tspan fill="#A89986">(</tspan><tspan fill="#D4BC91">id</tspan><tspan fill="#A89986">)</tspan>
      </text>
      <!-- L4: if (cached) return cached -->
      <text x="20" y="128" fill="#A89986">4</text>
      <text x="50" y="128">
        <tspan fill="#A89986">  </tspan><tspan fill="#C586B0">if</tspan><tspan fill="#A89986"> (</tspan><tspan fill="#D4BC91">cached</tspan><tspan fill="#A89986">) </tspan><tspan fill="#C586B0">return</tspan><tspan fill="#D4BC91"> cached</tspan>
      </text>
      <!-- L5: blank -->
      <text x="20" y="150" fill="#A89986">5</text>
      <!-- L6: const user = await api.fetch(`/users/${id}`) -->
      <text x="20" y="172" fill="#A89986">6</text>
      <text x="50" y="172">
        <tspan fill="#A89986">  </tspan><tspan fill="#C586B0">const</tspan><tspan fill="#D4BC91"> user </tspan><tspan fill="#A89986">= </tspan><tspan fill="#C586B0">await </tspan><tspan fill="#D4BC91">api</tspan><tspan fill="#A89986">.</tspan><tspan fill="#88A6C5">fetch</tspan><tspan fill="#A89986">(</tspan><tspan fill="#98C379">`/users/${</tspan><tspan fill="#D4BC91">id</tspan><tspan fill="#98C379">}`</tspan><tspan fill="#A89986">)</tspan>
      </text>
      <!-- L7: return cache.set(id, user) -->
      <text x="20" y="194" fill="#A89986">7</text>
      <text x="50" y="194">
        <tspan fill="#A89986">  </tspan><tspan fill="#C586B0">return </tspan><tspan fill="#D4BC91">cache</tspan><tspan fill="#A89986">.</tspan><tspan fill="#88A6C5">set</tspan><tspan fill="#A89986">(</tspan><tspan fill="#D4BC91">id</tspan><tspan fill="#A89986">, </tspan><tspan fill="#D4BC91">user</tspan><tspan fill="#A89986">)</tspan>
      </text>
      <!-- L8: } -->
      <text x="20" y="216" fill="#A89986">8</text>
      <text x="50" y="216" fill="#A89986">}</text>
      <!-- L9: blank -->
      <text x="20" y="238" fill="#A89986">9</text>
      <!-- L10: const ADMIN_ID = 42 -->
      <text x="14" y="260" fill="#A89986">10</text>
      <text x="50" y="260">
        <tspan fill="#C586B0">const</tspan><tspan fill="#D4BC91"> ADMIN_ID </tspan><tspan fill="#A89986">= </tspan><tspan fill="#D19A66">42</tspan>
      </text>
      <!-- L11: const COLOR = "#D4BC91" -->
      <text x="14" y="282" fill="#A89986">11</text>
      <text x="50" y="282">
        <tspan fill="#C586B0">const</tspan><tspan fill="#D4BC91"> COLOR </tspan><tspan fill="#A89986">= </tspan><tspan fill="#98C379">"#D4BC91"</tspan>
      </text>
    </g>

    <!-- Selection overlay on line 4 (showing selection bg with high-emphasis text) -->
    <rect x="50" y="114" width="240" height="18" fill="#D4BC91" opacity="0.18"/>

