# Umber Storm — DRAFT (palettes/next/). Not rendered; compare in the Palette Lab.
#
# Indigo night. Deep ultramarine ground, cool moonlit text, a lightning-amber signature. Charged code: electric-violet keywords, cyan functions, spring-green strings at full voltage against the dark.
#
# Generated from OKLCH specs; tune in the lab and export.

[meta]
description = "Moonlit text on deep indigo with a lightning-amber signature."
concept = "Indigo night. Deep ultramarine ground, cool moonlit text, a lightning-amber signature. Charged code: electric-violet keywords, cyan functions, spring-green strings at full voltage against the dark."
wallpaper_description = "Procedurally generated palette-tinted gradient — see scripts/render_wallpaper.py."

[hearth]
"0"                 = "#191B34"   # L 0.235 C 0.048 h 278  deepest bg — editor, view, terminal
"1"                 = "#21243E"   # L 0.272 C 0.048 h 278  panel bg — sidebar, window
"2"                 = "#2B2E48"   # L 0.312 C 0.046 h 278  raised — status/title bar, hover
"3"                 = "#42455C"   # L 0.398 C 0.038 h 278  active / border / tooltip
"4"                 = "#6D718A"   # L 0.555 C 0.038 h 278  control outline — inputs, checkboxes, dropdowns (>= 3:1)

[glow]
"0"                 = "#98A1AD"   # L 0.705 C 0.020 h 258  muted — hints, line numbers
"1"                 = "#BECADC"   # L 0.835 C 0.028 h 258  body text
"2"                 = "#D4DDEB"   # L 0.895 C 0.022 h 258  emphasis — active tab, titles
"3"                 = "#EAEFF7"   # L 0.950 C 0.012 h 258  strong — cursor, url text

[mist]
"0"                 = "#79D8BB"   # L 0.815 C 0.100 h 172  types, classes
"1"                 = "#41B0BC"   # L 0.700 C 0.100 h 205  regex, ANSI cyan
"2"                 = "#6BC3F4"   # L 0.780 C 0.110 h 235  functions, links, info, ANSI blue
"3"                 = "#848DAA"   # L 0.645 C 0.045 h 272  comments, hints

[spark]
red                 = "#EC6771"   # L 0.680 C 0.165 h  18  errors, tags, removed
orange              = "#FA9259"   # L 0.760 C 0.145 h  48  numbers, constants
amber               = "#FBA541"   # L 0.790 C 0.150 h  66  warnings, find, modified
green               = "#77DB88"   # L 0.810 C 0.150 h 148  strings, success, added
violet              = "#BB8AEF"   # L 0.720 C 0.150 h 305  keywords, visited links

[accent]
signature           = "#EBDE77"   # L 0.890 C 0.125 h 102  focus ring, active tab, primary button, progress
signature_hover     = "#F5EB9C"   # L 0.930 C 0.100 h 102
on_signature        = "#181A2A"   # L 0.225 C 0.030 h 278  text on the signature
highlight           = "#DED29D"   # L 0.860 C 0.070 h  96  selection background (light tint of the signature)
highlight_alt       = "#D3C692"   # L 0.825 C 0.070 h  96  alternate selected row
highlight_text      = "#1C1E33"   # L 0.245 C 0.040 h 278  text on selection
highlight_inactive  = "#424557"   # L 0.395 C 0.030 h 278  secondary text on selection
highlight_link      = "#18467D"   # L 0.395 C 0.105 h 255  on selection
highlight_visited   = "#603067"   # L 0.395 C 0.105 h 322  on selection
highlight_negative  = "#7C2121"   # L 0.395 C 0.125 h  25  on selection
highlight_neutral   = "#5C4102"   # L 0.395 C 0.080 h  82  on selection
highlight_positive  = "#1C5421"   # L 0.395 C 0.100 h 145  on selection

# Terminal: normal colors map from spark/mist; these are the extras.
[ansi]
black               = "#474C6B"   # L 0.425 C 0.053 h 278
blue                = "#72B1F6"   # L 0.745 C 0.120 h 252
cyan                = "#72D0D0"   # L 0.800 C 0.090 h 195
bright_red          = "#FF8289"   # L 0.750 C 0.151 h  18
bright_green        = "#87F49A"   # L 0.880 C 0.160 h 148
bright_yellow       = "#FFC488"   # L 0.860 C 0.102 h  66
bright_blue         = "#95C7FF"   # L 0.815 C 0.096 h 252
bright_magenta      = "#CEA4FF"   # L 0.790 C 0.133 h 305
bright_cyan         = "#7DE9E8"   # L 0.870 C 0.100 h 195
faint_red           = "#9D474C"   # L 0.510 C 0.115 h  18
faint_green         = "#5D9E67"   # L 0.640 C 0.105 h 148
faint_yellow        = "#B1783B"   # L 0.620 C 0.105 h  66
faint_blue          = "#537CA9"   # L 0.575 C 0.084 h 252
faint_magenta       = "#8061A3"   # L 0.550 C 0.105 h 305
faint_cyan          = "#599595"   # L 0.630 C 0.063 h 195

# Draft role mapping. The shared part moves into roles.toml on promotion.
[role]
accent            = "accent.signature"
interactive       = "role.accent"
interactive_hover = "accent.signature_hover"
fg_on_accent      = "accent.on_signature"
focus_ring        = "role.accent"
decoration_focus  = "role.accent"
decoration_hover  = "role.fg_muted"
link              = "mist.2"
selection_bg      = "accent.highlight"
selection_alt     = "accent.highlight_alt"
brand             = "role.accent"
link_ntp          = "role.link"
focus_field       = "role.focus_ring"
input_border      = "hearth.4"

[role.on_selection]
fg_soft     = "accent.highlight_text"
decoration  = "accent.highlight_text"
fg_inactive = "accent.highlight_inactive"

[role.syntax]
type        = "mist.0"
markup_link = "role.link"

[role.ansi]
black       = "ansi.black"
blue        = "ansi.blue"
cyan        = "ansi.cyan"
bright_blue = "ansi.bright_blue"
