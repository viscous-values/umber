# Umber Ash — DRAFT (palettes/next/). Not rendered; compare in the Palette Lab.
#
# Charcoal and sanguine drawing. True-neutral graphite ground, paper-white text, one red-chalk signature; selections are a graphite wash. Code stays inky and low in chroma (blue-black, ink violet, ochre) so the chalk is the one vivid event.
#
# Generated from OKLCH specs; tune in the lab and export.

[meta]
description = "Paper white on neutral graphite with a red-chalk (sanguine) signature."
concept = "Charcoal and sanguine drawing. True-neutral graphite ground, paper-white text, one red-chalk signature; selections are a graphite wash. Code stays inky and low in chroma (blue-black, ink violet, ochre) so the chalk is the one vivid event."
wallpaper_description = "Procedurally generated palette-tinted gradient — see scripts/render_wallpaper.py."

[hearth]
"0"                 = "#1E1E1E"   # L 0.235 C 0.000 h   0  deepest bg — editor, view, terminal
"1"                 = "#272727"   # L 0.272 C 0.000 h   0  panel bg — sidebar, window
"2"                 = "#313131"   # L 0.312 C 0.000 h   0  raised — status/title bar, hover
"3"                 = "#474747"   # L 0.398 C 0.000 h   0  active / border / tooltip
"4"                 = "#737373"   # L 0.555 C 0.000 h   0  control outline — inputs, checkboxes, dropdowns (>= 3:1)
hover               = "#595959"   # L 0.465 C 0.000 h   0  hover on an active surface — secondary button, scrollbar thumb

[glow]
"0"                 = "#A1A09C"   # L 0.705 C 0.006 h  95  muted — hints, line numbers
"1"                 = "#CAC9C4"   # L 0.835 C 0.007 h  95  body text
"2"                 = "#DDDCD8"   # L 0.895 C 0.006 h  95  emphasis — active tab, titles
"3"                 = "#EFEEEB"   # L 0.950 C 0.004 h  95  strong — cursor, url text

[mist]
"0"                 = "#89C8B6"   # L 0.785 C 0.070 h 175  types, classes
"1"                 = "#71AAAD"   # L 0.700 C 0.060 h 200  regex, ANSI cyan
"2"                 = "#85B0E1"   # L 0.745 C 0.085 h 252  functions, links, info, ANSI blue
"3"                 = "#878787"   # L 0.625 C 0.000 h   0  comments, hints

[spark]
red                 = "#EF678B"   # L 0.690 C 0.170 h   6  errors, tags, removed
orange              = "#E1A583"   # L 0.770 C 0.085 h  50  numbers, constants
amber               = "#E9C87E"   # L 0.845 C 0.100 h  86  warnings, find, modified
green               = "#8BC392"   # L 0.765 C 0.090 h 148  strings, success, added
violet              = "#C38DC6"   # L 0.715 C 0.100 h 325  keywords, visited links

[accent]
signature           = "#BD7564"   # L 0.635 C 0.095 h  34  focus ring, active tab, primary button, progress
signature_hover     = "#CF8A7A"   # L 0.700 C 0.088 h  34
on_signature        = "#1C1C1C"   # L 0.225 C 0.000 h   0  text on the signature
highlight           = "#C3C8CE"   # L 0.830 C 0.010 h 250  selection background (light tint of the signature)
highlight_alt       = "#B7BDC2"   # L 0.795 C 0.010 h 250  alternate selected row
highlight_text      = "#1D2125"   # L 0.245 C 0.010 h 250  text on selection
highlight_inactive  = "#42474C"   # L 0.395 C 0.010 h 250  secondary text on selection
highlight_link      = "#18467D"   # L 0.395 C 0.105 h 255  on selection
highlight_visited   = "#603067"   # L 0.395 C 0.105 h 322  on selection
highlight_negative  = "#7C2121"   # L 0.395 C 0.125 h  25  on selection
highlight_neutral   = "#5C4102"   # L 0.395 C 0.080 h  82  on selection
highlight_positive  = "#1C5421"   # L 0.395 C 0.100 h 145  on selection

# Terminal: normal colors map from spark/mist; these are the extras.
[ansi]
black               = "#514D4E"   # L 0.425 C 0.005 h   0
blue                = "#80B0E7"   # L 0.745 C 0.095 h 252
cyan                = "#72D0D0"   # L 0.800 C 0.090 h 195
bright_red          = "#FF85A2"   # L 0.760 C 0.150 h   6
bright_green        = "#9CDBA4"   # L 0.835 C 0.100 h 148
bright_yellow       = "#FFDF99"   # L 0.915 C 0.094 h  86
bright_blue         = "#95C7FF"   # L 0.815 C 0.096 h 252
bright_magenta      = "#DDA0E0"   # L 0.785 C 0.110 h 325
bright_cyan         = "#7DE9E8"   # L 0.870 C 0.100 h 195
faint_red           = "#A0485E"   # L 0.520 C 0.119 h   6
faint_green         = "#65896A"   # L 0.595 C 0.063 h 148
faint_yellow        = "#AA9464"   # L 0.675 C 0.070 h  86
faint_blue          = "#5C7C9F"   # L 0.575 C 0.066 h 252
faint_magenta       = "#856287"   # L 0.545 C 0.070 h 325
faint_cyan          = "#599595"   # L 0.630 C 0.063 h 195

# Draft role mapping. The shared part moves into roles.toml on promotion.
[role]
accent            = "accent.signature"
interactive       = "role.accent"
interactive_hover = "accent.signature_hover"
fg_on_accent      = "accent.on_signature"
focus_ring        = "role.accent"
decoration_focus  = "role.accent"
decoration_hover  = "role.fg_muted"
link              = "mist.2"
info              = "mist.1"
selection_bg      = "accent.highlight"
selection_alt     = "accent.highlight_alt"
brand             = "role.accent"
link_ntp          = "role.link"
focus_field       = "role.focus_ring"
input_border      = "hearth.4"
bg_active_hover   = "hearth.hover"

[role.on_selection]
fg_soft     = "accent.highlight_text"
decoration  = "accent.highlight_text"
fg_inactive = "accent.highlight_inactive"

[role.syntax]
type        = "mist.0"
markup_link = "role.link"
string      = "spark.amber"

[role.ansi]
black       = "ansi.black"
blue        = "ansi.blue"
cyan        = "ansi.cyan"
bright_blue = "ansi.bright_blue"
