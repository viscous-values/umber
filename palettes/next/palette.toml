# Umber — DRAFT (palettes/next/). Not rendered; compare in the Palette Lab.
#
# Fireside. Raw-umber ground, cream text, a burnt-sienna signature. Code in earth pigments: madder keywords, terre-verte types, sap-green strings, cadmium numbers, with cerulean as the one cool note.
#
# Generated from OKLCH specs; tune in the lab and export.

[meta]
description = "Cream on raw umber with a burnt-sienna signature, the canonical fireside palette."
concept = "Fireside. Raw-umber ground, cream text, a burnt-sienna signature. Code in earth pigments: madder keywords, terre-verte types, sap-green strings, cadmium numbers, with cerulean as the one cool note."
wallpaper_description = "Procedurally generated palette-tinted gradient — see scripts/render_wallpaper.py."

[hearth]
"0"                 = "#271B11"   # L 0.235 C 0.026 h  62  deepest bg — editor, view, terminal
"1"                 = "#30241A"   # L 0.272 C 0.026 h  62  panel bg — sidebar, window
"2"                 = "#3B2E23"   # L 0.312 C 0.026 h  62  raised — status/title bar, hover
"3"                 = "#50453B"   # L 0.398 C 0.022 h  62  active / border / tooltip

[glow]
"0"                 = "#AA9E8B"   # L 0.705 C 0.030 h  80  muted — hints, line numbers
"1"                 = "#D9C6A8"   # L 0.835 C 0.046 h  80  body text
"2"                 = "#EBDABF"   # L 0.895 C 0.040 h  80  emphasis — active tab, titles
"3"                 = "#F7EDDD"   # L 0.950 C 0.024 h  80  strong — cursor, url text

[mist]
"0"                 = "#8CCAAF"   # L 0.790 C 0.075 h 165  types, classes
"1"                 = "#5DAEAE"   # L 0.700 C 0.080 h 195  regex, ANSI cyan
"2"                 = "#80BAE4"   # L 0.765 C 0.085 h 240  functions, links, info, ANSI blue
"3"                 = "#958676"   # L 0.630 C 0.030 h  70  comments, hints

[spark]
red                 = "#E66F64"   # L 0.680 C 0.150 h  27  errors, tags, removed
orange              = "#F2A660"   # L 0.785 C 0.125 h  62  numbers, constants
amber               = "#EDD473"   # L 0.870 C 0.120 h  95  warnings, find, modified
green               = "#9FC56B"   # L 0.775 C 0.125 h 128  strings, success, added
violet              = "#D988A8"   # L 0.720 C 0.105 h 355  keywords, visited links

[accent]
signature           = "#EB9251"   # L 0.740 C 0.135 h  55  focus ring, active tab, primary button, progress
signature_hover     = "#F4A76A"   # L 0.790 C 0.120 h  58
on_signature        = "#25190F"   # L 0.225 C 0.026 h  62  text on the signature
highlight           = "#E3B492"   # L 0.805 C 0.072 h  58  selection background (light tint of the signature)
highlight_alt       = "#D8A987"   # L 0.770 C 0.072 h  58  alternate selected row
highlight_text      = "#2D1C0E"   # L 0.245 C 0.036 h  60  text on selection
highlight_inactive  = "#534336"   # L 0.395 C 0.030 h  60  secondary text on selection
highlight_link      = "#18467D"   # L 0.395 C 0.105 h 255  on selection
highlight_visited   = "#603067"   # L 0.395 C 0.105 h 322  on selection
highlight_negative  = "#7C2121"   # L 0.395 C 0.125 h  25  on selection
highlight_neutral   = "#5C4102"   # L 0.395 C 0.080 h  82  on selection
highlight_positive  = "#1C5421"   # L 0.395 C 0.100 h 145  on selection

# Terminal: normal colors map from spark/mist; these are the extras.
[ansi]
black               = "#5B4B3D"   # L 0.425 C 0.031 h  62
blue                = "#80B0E7"   # L 0.745 C 0.095 h 252
cyan                = "#72D0D0"   # L 0.800 C 0.090 h 195
bright_red          = "#FF8579"   # L 0.750 C 0.151 h  27
bright_green        = "#B3DD7A"   # L 0.845 C 0.135 h 128
bright_yellow       = "#FFEBA1"   # L 0.940 C 0.096 h  95
bright_blue         = "#95C7FF"   # L 0.815 C 0.096 h 252
bright_magenta      = "#F59BBE"   # L 0.790 C 0.115 h 355
bright_cyan         = "#7DE9E8"   # L 0.870 C 0.100 h 195
faint_red           = "#994C44"   # L 0.510 C 0.105 h  27
faint_green         = "#728C52"   # L 0.605 C 0.087 h 128
faint_yellow        = "#AF9E60"   # L 0.700 C 0.084 h  95
faint_blue          = "#5C7C9F"   # L 0.575 C 0.066 h 252
faint_magenta       = "#945F74"   # L 0.550 C 0.073 h 355
faint_cyan          = "#599595"   # L 0.630 C 0.063 h 195

# Draft role mapping. The shared part moves into roles.toml on promotion.
[role]
accent            = "accent.signature"
interactive       = "role.accent"
interactive_hover = "accent.signature_hover"
fg_on_accent      = "accent.on_signature"
focus_ring        = "role.accent"
decoration_focus  = "role.accent"
decoration_hover  = "role.fg_muted"
link              = "mist.2"
selection_bg      = "accent.highlight"
selection_alt     = "accent.highlight_alt"
brand             = "role.accent"

[role.on_selection]
fg_soft     = "accent.highlight_text"
decoration  = "accent.highlight_text"
fg_inactive = "accent.highlight_inactive"

[role.syntax]
type        = "mist.0"
markup_link = "role.link"

[role.ansi]
black       = "ansi.black"
blue        = "ansi.blue"
cyan        = "ansi.cyan"
bright_blue = "ansi.bright_blue"
