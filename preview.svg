<svg xmlns="http://www.w3.org/2000/svg" width="256" height="162" viewBox="0 0 256 162">
  <!-- desktop background -->
  <rect width="256" height="162" fill="#2D2823"/>

  <!-- window -->
  <rect x="36" y="22" width="184" height="108" rx="6" fill="#2D2823" stroke="#26221E" stroke-width="1"/>
  <!-- titlebar -->
  <rect x="36" y="22" width="184" height="20" rx="6" fill="#363029"/>
  <rect x="36" y="36" width="184" height="6" fill="#363029"/>
  <!-- traffic dots -->
  <circle cx="48" cy="32" r="3" fill="#D4BC91"/>
  <circle cx="58" cy="32" r="3" fill="#a89986"/>
  <circle cx="68" cy="32" r="3" fill="#a89986"/>
  <!-- title text -->
  <text x="128" y="36" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="9" fill="#D4BC91" letter-spacing="1">umber</text>

  <!-- list rows in window -->
  <rect x="48" y="54" width="160" height="14" rx="3" fill="#26221E"/>
  <text x="56" y="64" font-family="Noto Sans, sans-serif" font-size="8" fill="#D4BC91">Documents</text>

  <!-- selected row -->
  <rect x="48" y="72" width="160" height="14" rx="3" fill="#D4BC91"/>
  <text x="56" y="82" font-family="Noto Sans, sans-serif" font-size="8" fill="#2D2823" font-weight="500">Pictures</text>

  <rect x="48" y="90" width="160" height="14" rx="3" fill="#26221E"/>
  <text x="56" y="100" font-family="Noto Sans, sans-serif" font-size="8" fill="#D4BC91">Music</text>

  <!-- buttons -->
  <rect x="48" y="110" width="50" height="14" rx="3" fill="#48413A"/>
  <text x="73" y="120" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="8" fill="#D4BC91">Cancel</text>
  <rect x="158" y="110" width="50" height="14" rx="3" fill="#D4BC91"/>
  <text x="183" y="120" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="8" fill="#2D2823" font-weight="500">OK</text>

  <!-- panel -->
  <rect x="0" y="148" width="256" height="14" fill="#26221E"/>
  <circle cx="12" cy="155" r="4" fill="#D4BC91"/>
  <rect x="22" y="153" width="20" height="4" rx="1" fill="#a89986"/>
  <rect x="48" y="153" width="20" height="4" rx="1" fill="#a89986"/>
  <text x="244" y="158" text-anchor="end" font-family="Noto Sans, sans-serif" font-size="7" fill="#D4BC91">21:00</text>
</svg>
