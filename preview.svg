<svg xmlns="http://www.w3.org/2000/svg" width="256" height="162" viewBox="0 0 256 162">
  <!-- Store-listing thumbnail for canonical Umber, rendered from the palette. -->
  <!-- desktop background -->
  <rect width="256" height="162" fill="#322417"/>

  <!-- window -->
  <rect x="36" y="22" width="184" height="108" rx="6" fill="#322417" stroke="#291B0E" stroke-width="1"/>
  <!-- titlebar -->
  <rect x="36" y="22" width="184" height="20" rx="6" fill="#3C2E21"/>
  <rect x="36" y="36" width="184" height="6" fill="#3C2E21"/>
  <!-- traffic dots -->
  <circle cx="48" cy="32" r="3" fill="#EB9251"/>
  <circle cx="58" cy="32" r="3" fill="#AA9E8B"/>
  <circle cx="68" cy="32" r="3" fill="#AA9E8B"/>
  <!-- title text -->
  <text x="128" y="36" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="9" fill="#D9C6A8" letter-spacing="1">umber</text>

  <!-- list rows in window -->
  <rect x="48" y="54" width="160" height="14" rx="3" fill="#291B0E"/>
  <text x="56" y="64" font-family="Noto Sans, sans-serif" font-size="8" fill="#D9C6A8">Documents</text>

  <!-- selected row -->
  <rect x="48" y="72" width="160" height="14" rx="3" fill="#E3B492"/>
  <text x="56" y="82" font-family="Noto Sans, sans-serif" font-size="8" fill="#2E1C0B" font-weight="500">Pictures</text>

  <rect x="48" y="90" width="160" height="14" rx="3" fill="#291B0E"/>
  <text x="56" y="100" font-family="Noto Sans, sans-serif" font-size="8" fill="#D9C6A8">Music</text>

  <!-- buttons -->
  <rect x="48" y="110" width="50" height="14" rx="3" fill="#51443A"/>
  <text x="73" y="120" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="8" fill="#D9C6A8">Cancel</text>
  <rect x="158" y="110" width="50" height="14" rx="3" fill="#EB9251"/>
  <text x="183" y="120" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="8" fill="#26190D" font-weight="500">OK</text>

  <!-- panel -->
  <rect x="0" y="148" width="256" height="14" fill="#291B0E"/>
  <circle cx="12" cy="155" r="4" fill="#EB9251"/>
  <rect x="22" y="153" width="20" height="4" rx="1" fill="#AA9E8B"/>
  <rect x="48" y="153" width="20" height="4" rx="1" fill="#AA9E8B"/>
  <text x="244" y="158" text-anchor="end" font-family="Noto Sans, sans-serif" font-size="7" fill="#D9C6A8">21:00</text>
</svg>
