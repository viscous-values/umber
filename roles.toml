# Umber semantic roles — what each color DOES, mapped onto palette tiers.
#
# Templates under scripts/templates/ reference role.* only; the pigment
# tiers (hearth / glow / mist / spark / accent / ansi) live in palette.toml
# and palettes/*.toml. A variant overrides any role in its own [role] table:
#
#   [role.syntax]
#   string = "spark.amber"
#
# Values are a literal "#RRGGBB" or a reference ("glow.2", "role.fg").
# scripts/palette_lib.py merges these defaults with the variant's overrides
# (unknown override keys are rejected) and resolves every role to hex.
#
# Mapping principles (2026-10 redesign, see PALETTE-REVISIT.md):
# - accent is the variant's signature; focus, active indicators, primary
#   buttons, progress and the splash all use it.
# - selection is a light tint derived from the signature (accent.highlight),
#   with its own hue-distinct set of colors for text drawn on it.
# - links are the blue pigment (mist.2), visited links the violet (spark.violet);
#   info uses the cyan (mist.1) so it never looks clickable.
# - input outlines get their own step (hearth.4) so controls reach 3:1;
#   decorative lines (border) stay faint.

[role]
# Surfaces — deepest to most raised.
bg             = "hearth.0"   # editor, view, terminal, splash, new-tab page
bg_panel       = "hearth.1"   # sidebars, menus, widgets, window, inactive tabs
bg_raised      = "hearth.2"   # status/title bar, hover, section headers, url field
bg_active      = "hearth.3"   # focused/inactive-selected rows, pressed buttons
bg_overlay     = "hearth.3"   # tooltips
line_highlight = "role.bg_panel"   # editor current-line band

# Lines.
border    = "hearth.3"   # popup/widget frames, menu separators, guides (may stay faint)
input_border = "hearth.4"   # outline that identifies a control: text field, checkbox, dropdown (>= 3:1)
divider   = "hearth.1"   # hairlines between same-level panes
separator = "hearth.2"   # faint rules: indent guides, rulers, toolbar separators

# Text.
fg           = "glow.1"   # body text
fg_muted     = "glow.0"   # hints, inactive, line numbers, placeholders
fg_emphasis  = "glow.2"   # active tab, titles, focused list rows
fg_strong    = "glow.3"   # brightest text: active foreground, url/popup text
fg_on_accent = "accent.on_signature" # text on filled buttons, badges, status items
cursor       = "glow.3"

# Hover on an active surface, and the shadow color for scrims.
bg_active_hover = "hearth.hover"   # hover on bg_active: secondary button, scrollbar thumb
shadow          = "#000000"   # drop shadows and scrims (alpha set in templates)

# Identity + interaction.
accent            = "accent.signature"  # the variant's signature: active tab line, focus, primary buttons
interactive       = "role.accent"       # badges, progress, matches
interactive_hover = "accent.signature_hover"
button_bg         = "role.interactive"
button_hover      = "role.interactive_hover"
focus_ring        = "role.accent"       # VSCode focusBorder, Firefox url-field focus
decoration_focus  = "role.accent"       # Plasma DecorationFocus, SDDM/lockscreen accent
decoration_hover  = "role.fg_muted"     # Plasma DecorationHover: quieter than focus

# Links.
link         = "mist.2"
link_visited = "spark.violet"


# Selection.
selection_bg  = "accent.highlight"       # light tint of the signature
selection_alt = "accent.highlight_alt"   # Plasma [Colors:Selection] BackgroundAlternate

# Status.
error     = "spark.red"
warning   = "spark.amber"
success   = "spark.green"
info      = "mist.1"
hint      = "mist.3"
debug     = "spark.orange"
attention = "spark.amber"   # find matches, tab/icon attention
brand     = "role.accent"   # splash glimmer pip, extension icon

# Version control.
diff_added    = "spark.green"
diff_removed  = "spark.red"
diff_modified = "spark.amber"

# Text drawn ON the selection background (Plasma [Colors:Selection],
# VSCode/Firefox selected rows). Keep each >= 4.5:1 against selection_bg.
[role.on_selection]
fg          = "accent.highlight_text"
fg_soft     = "accent.highlight_text"   # Plasma ForegroundNormal
fg_inactive = "accent.highlight_inactive"
decoration  = "accent.highlight_text"
link        = "accent.highlight_link"
visited     = "accent.highlight_visited"
negative    = "accent.highlight_negative"
neutral     = "accent.highlight_neutral"
positive    = "accent.highlight_positive"

# Code. VSCode tokenColors + semanticTokenColors.
[role.syntax]
comment     = "mist.3"
keyword     = "spark.violet"
storage     = "role.syntax.keyword"   # const, let, class, fn
builtin     = "role.syntax.keyword"   # this, self, super
macro       = "role.syntax.keyword"
operator    = "glow.0"
punctuation = "role.syntax.operator"
function    = "mist.2"
namespace   = "role.syntax.function"  # semantic tokens
type        = "mist.0"
class       = "role.syntax.type"
decorator   = "role.syntax.type"
attribute   = "role.syntax.type"
string      = "spark.green"
number      = "spark.orange"
constant    = "role.syntax.number"
escape      = "role.syntax.number"
regex       = "mist.1"
variable    = "role.fg"
parameter   = "role.syntax.variable"
property    = "role.syntax.variable"
key         = "mist.2"                # JSON/YAML keys, CSS properties
tag         = "spark.red"             # HTML/JSX tags, CSS selectors
heading     = "role.syntax.keyword"   # markdown
emphasis    = "role.fg_emphasis"      # markdown bold/italic
markup_link = "role.link"
markup_code = "role.syntax.string"
markup_list = "role.syntax.number"
quote       = "role.syntax.comment"
invalid     = "role.error"
deprecated  = "role.fg_muted"

# Bracket-pair colorization, outermost first.
[role.bracket]
"1" = "role.fg"
"2" = "role.syntax.function"
"3" = "role.syntax.keyword"
"4" = "role.syntax.string"
"5" = "role.syntax.type"
"6" = "role.syntax.regex"

# Terminal (Konsole + VSCode integrated terminal).
[role.ansi]
bg           = "role.bg"
fg           = "role.fg"
fg_faint     = "role.fg_muted"
fg_intense   = "role.fg_strong"
cursor       = "role.cursor"
black        = "ansi.black"
red          = "spark.red"
green        = "spark.green"
yellow       = "spark.amber"
blue         = "ansi.blue"
magenta      = "spark.violet"
cyan         = "ansi.cyan"
white        = "glow.1"
bright_black = "glow.0"
bright_blue  = "ansi.bright_blue"
bright_white = "glow.3"
bright_red     = "ansi.bright_red"
bright_green   = "ansi.bright_green"
bright_yellow  = "ansi.bright_yellow"
bright_magenta = "ansi.bright_magenta"
bright_cyan    = "ansi.bright_cyan"
faint_black    = "hearth.1"
faint_red      = "ansi.faint_red"
faint_green    = "ansi.faint_green"
faint_yellow   = "ansi.faint_yellow"
faint_blue     = "ansi.faint_blue"
faint_magenta  = "ansi.faint_magenta"
faint_cyan     = "ansi.faint_cyan"
faint_white    = "glow.0"
